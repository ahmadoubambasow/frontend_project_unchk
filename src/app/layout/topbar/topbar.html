<div class="topbar">

  <!-- Left -->
  <div class="topbar-left">

    <h2>

      Tableau de bord

    </h2>

  </div>

  <!-- Right -->
  <div class="topbar-right">

    <!-- Search -->
    <div class="search-box">

      <mat-icon>

        search

      </mat-icon>

      <input
        type="text"
        placeholder="Rechercher...">

    </div>

    <!-- Notifications -->

    <button
      mat-icon-button

      [matMenuTriggerFor]="notificationMenu"
    
      [matBadge]="unreadCount"

        matBadgeColor="warn"

        [matBadgeHidden]="unreadCount === 0"
    >

      <mat-icon>

        notifications

      </mat-icon>

    </button>

    <mat-menu
      #notificationMenu="matMenu">

      <div
        class="notification-header">

        Notifications

      </div>

      <ng-container
        *ngIf="notifications.length">

        <button

          mat-menu-item

          *ngFor="
            let notification
            of notifications
          "

          (click)="
            markAsRead(
              notification
            )
          ">

          <div

            class="notification-item"

            [class.unread]="
              !notification.isRead
            ">

            <strong>

              {{ notification.title }}

            </strong>

            <small>

              {{ notification.message }}

            </small>

            <span
              class="notification-date">

              {{
                notification.createdAt

                  | date:'dd/MM/yyyy HH:mm'
              }}

            </span>

          </div>

        </button>

      </ng-container>

      <div

        *ngIf="
          !notifications.length
        "

        class="empty-notification">

        Aucune notification

      </div>

    </mat-menu>
    <div class="notification-container">

  <button
    class="notification-button"
    (click)="showNotifications = !showNotifications">

    <mat-icon>
      notifications
    </mat-icon>

    <span
      class="notification-badge"
      *ngIf="unreadCount > 0">

      {{ unreadCount }}

    </span>

  </button>

  <div
    class="notification-dropdown"

    *ngIf="showNotifications">

    <div
      *ngIf="notifications.length">

      <div

        *ngFor="let notification of notifications"

        class="notification-item"

        (click)="markAsRead(notification)">

        <strong>

          {{ notification.title }}

        </strong>

        <small>

          {{ notification.message }}

        </small>

      </div>

    </div>

    <div
      *ngIf="!notifications.length">

      Aucune notification

    </div>

  </div>

</div>

    <!-- Logout -->

    <button
      mat-icon-button
      (click)="logout()">

      <mat-icon>

        logout

      </mat-icon>

    </button>

  </div>

</div>
