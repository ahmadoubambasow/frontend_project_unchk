<div class="sidebar">

  <!-- Logo -->
  <div class="sidebar-header">

    <div class="logo">

      <div class="logo-circle">
        U
      </div>

      <div>

        <h2>UNCHK</h2>

        <p>Management</p>

      </div>

    </div>

  </div>

  <!-- Menu principal -->
  <div class="menu">

    <a
      *ngFor="let item of menuItems"
      [routerLink]="item.route"
      routerLinkActive="active-link"
      [routerLinkActiveOptions]="{ exact: false }">

      <mat-icon>
        {{ item.icon }}
      </mat-icon>

      <span>
        {{ item.label }}
      </span>

    </a>

  </div>

  <!-- Utilisateur -->
  <div class="user-section">

    <div
      class="sidebar-user"
      (click)="toggleUserMenu(); $event.stopPropagation()">

      <div class="avatar">

        {{
          user?.fullName
            ? user.fullName.charAt(0).toUpperCase()
            : 'U'
        }}

      </div>

      <div class="user-info">

        <h4>
          {{ user?.fullName || 'Utilisateur' }}
        </h4>

        <p>
          {{ user?.role || 'Invité' }}
        </p>

      </div>

      <mat-icon
        class="dropdown-icon"
        [class.rotate]="showUserMenu">

        expand_more

      </mat-icon>

    </div>

    <!-- Menu déroulant -->
    <div
      class="user-dropdown"
      *ngIf="showUserMenu">

      <a
        routerLink="/profile"
        (click)="showUserMenu = false">

        <mat-icon>
          person
        </mat-icon>

        <span>
          Mon profil
        </span>

      </a>

      <button
        type="button"
        (click)="showUserMenu = false; logout()">

        <mat-icon>
          logout
        </mat-icon>

        <span>
          Déconnexion
        </span>

      </button>

    </div>

  </div>

</div>
