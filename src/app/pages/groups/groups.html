<div class="groups-page">

  <!-- Header -->
  <div class="page-header">

    <div>

      <h1>
        Groupes
      </h1>

      <p>
        Gestion des groupes pédagogiques
      </p>

    </div>

    <button
      mat-raised-button
      color="primary"
      (click)="openCreateDialog()">

      <mat-icon>
        add
      </mat-icon>

      Nouveau groupe

    </button>

  </div>

  <!-- Recherche -->
  <div class="search-container">

    <mat-form-field appearance="outline">

      <mat-label>
        Rechercher un groupe
      </mat-label>

      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Nom, promotion, formation">

      <mat-icon matSuffix>
        search
      </mat-icon>

    </mat-form-field>

  </div>

  <!-- Tableau -->
  <div class="table-container">

    <table
      mat-table
      [dataSource]="dataSource">

      <!-- Nom -->
      <ng-container matColumnDef="name">

        <th mat-header-cell *matHeaderCellDef>
          Groupe
        </th>

        <td mat-cell *matCellDef="let group">

          {{ group.name }}

        </td>

      </ng-container>

      <!-- Promotion -->
      <ng-container matColumnDef="promotion">

        <th mat-header-cell *matHeaderCellDef>
          Promotion
        </th>

        <td mat-cell *matCellDef="let group">

          {{ group.promotionName }}

        </td>

      </ng-container>

      <!-- Formation -->
      <ng-container matColumnDef="formation">

        <th mat-header-cell *matHeaderCellDef>
          Formation
        </th>

        <td mat-cell *matCellDef="let group">

          {{ group.formationName }}

        </td>

      </ng-container>

      <!-- Capacité -->
      <ng-container matColumnDef="capacity">

        <th mat-header-cell *matHeaderCellDef>
          Capacité
        </th>

        <td mat-cell *matCellDef="let group">

          {{ group.capacity }}

        </td>

      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">

        <th mat-header-cell *matHeaderCellDef>
          Actions
        </th>

        <td mat-cell *matCellDef="let group">

          <button
            mat-icon-button
            (click)="openEditDialog(group)">

            <mat-icon color="primary">
              edit
            </mat-icon>

          </button>

          <button
            mat-icon-button
            (click)="deleteGroup(group)">

            <mat-icon color="warn">
              delete
            </mat-icon>

          </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns
        ">
      </tr>

    </table>

    <mat-paginator

      [pageSize]="5"

      [pageSizeOptions]="[
        5,
        10,
        20
      ]"

      showFirstLastButtons>

    </mat-paginator>

  </div>

</div>
