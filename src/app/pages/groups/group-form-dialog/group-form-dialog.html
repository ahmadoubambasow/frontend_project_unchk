<div class="dialog-container">

  <div class="dialog-header">

    <h2>

      {{
        data
          ? 'Modifier groupe'
          : 'Nouveau groupe'
      }}

    </h2>

    <p>

      Gestion des groupes pédagogiques

    </p>

  </div>

  <form [formGroup]="groupForm">

    <!-- Nom -->
    <mat-form-field appearance="outline">

      <mat-label>

        Nom du groupe

      </mat-label>

      <input
        matInput
        formControlName="name"
        placeholder="L3-A">

    </mat-form-field>

    <!-- Capacité -->
    <mat-form-field appearance="outline">

      <mat-label>

        Capacité

      </mat-label>

      <input
        matInput
        type="number"
        formControlName="capacity">

    </mat-form-field>

    <!-- Formation -->
    <mat-form-field appearance="outline">

      <mat-label>

        Formation

      </mat-label>

      <mat-select
        formControlName="formationId">

        <mat-option

          *ngFor="
            let formation
            of formations
          "

          [value]="formation.id">

          {{ formation.name }}

          -

          {{ formation.code }}

        </mat-option>

      </mat-select>

    </mat-form-field>
    
  </form>

  <div class="dialog-actions">

    <button
      mat-stroked-button
      (click)="dialogRef.close()">

      Annuler

    </button>

    <button

      mat-raised-button

      color="primary"

      (click)="submit()"

      [disabled]="
        loading ||
        groupForm.invalid
      ">

      {{

        loading

          ? (
              data
                ? 'Modification...'
                : 'Création...'
            )

          : (
              data
                ? 'Modifier'
                : 'Ajouter'
            )

      }}

    </button>

  </div>

</div>
