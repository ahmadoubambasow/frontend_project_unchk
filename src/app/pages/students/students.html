<div class="students-page">

  <div class="page-header">

    <div>

      <h1>

        Étudiants

      </h1>

      <p>

        Gestion des étudiants

      </p>

    </div>

    <button
      mat-raised-button
      color="primary"
      (click)="openCreateDialog()">

      <mat-icon>

        add

      </mat-icon>

      Nouvel étudiant

    </button>

  </div>

  <mat-form-field
    appearance="outline">

    <mat-label>

      Rechercher

    </mat-label>

    <input
      matInput
      (keyup)="applyFilter($event)">

  </mat-form-field>

  <div
    class="students-grid">

    <div

      class="student-card"

      *ngFor="
        let student
        of filteredStudents
      ">

      <div class="student-header">

  <div>

    <h3 class="student-name">
      {{ student.fullName }}
    </h3>

    <div class="student-ine">
      {{ student.ine }}
    </div>

  </div>

</div>

<div class="badges">

  <span class="badge badge-formation">
    {{ student.formationName }}
  </span>

  <span class="badge badge-promotion">
    {{ student.promotion }}
  </span>

</div>

      <div
        class="actions">

        <button
          mat-icon-button
            (click)="openDetails(student)"
        >

          <mat-icon>

            visibility

          </mat-icon>

        </button>

        <button
          mat-icon-button
          color="primary" (click)="openEditDialog(student)">

          <mat-icon>

            edit

          </mat-icon>

        </button>

        <button
          mat-icon-button
          color="warn" (click)="deleteStudent(student)">

          <mat-icon>

            delete

          </mat-icon>

        </button>

      </div>

    </div>

  </div>

</div>
