<div class="dialog-container">

  <div class="dialog-header">

    <h2>

      {{
        data
          ? 'Modifier étudiant'
          : 'Nouvel étudiant'
      }}

    </h2>

    <p>

      Gestion des dossiers étudiants

    </p>

  </div>

  <form

    [formGroup]="form"

    class="student-form">

    <div class="form-grid">

      <mat-form-field appearance="outline">

        <mat-label>

          Prénom

        </mat-label>

        <input
          matInput
          formControlName="firstName">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Nom

        </mat-label>

        <input
          matInput
          formControlName="lastName">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Date de naissance

        </mat-label>

        <input
          matInput
          type="date"
          formControlName="birthDate">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Formation

        </mat-label>

        <mat-select
          formControlName="formationId">

          <mat-option

            *ngFor="
              let formation
              of formations
            "

            [value]="formation.id">

            {{ formation.name }}

          </mat-option>

        </mat-select>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Groupe

        </mat-label>

        <mat-select
          formControlName="groupId">

          <mat-option

            *ngFor="
              let group
              of groups
            "

            [value]="group.id">

            {{ group.name }}

            -

            {{ group.promotion }}

          </mat-option>

        </mat-select>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Année d'entrée

        </mat-label>

        <input
          matInput
          type="number"
          formControlName="startYear">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Année de sortie

        </mat-label>

        <input
          matInput
          type="number"
          formControlName="graduationYear">

      </mat-form-field>

    </div>

    <mat-form-field
      appearance="outline"
      class="full-width">

      <mat-label>

        Diplômes obtenus

      </mat-label>

      <textarea
        matInput
        rows="4"
        formControlName="diplomas">

      </textarea>

    </mat-form-field>

    <mat-form-field
      appearance="outline"
      class="full-width">

      <mat-label>

        Autres formations

      </mat-label>

      <textarea
        matInput
        rows="4"
        formControlName="otherTrainings">

      </textarea>

    </mat-form-field>

  </form>

  <div class="dialog-actions">

    <button

      mat-stroked-button

      (click)="dialogRef.close()">

      Annuler

    </button>

    <button

      mat-raised-button

      color="primary"

      [disabled]="loading"

      (click)="submit()">

      {{

        loading

          ? 'Enregistrement...'

          : data

            ? 'Modifier'

            : 'Créer'
      }}

    </button>

  </div>

</div>
