<!-- ===================================
     KPI
=================================== -->

<div class="dashboard-grid">

  <div class="stat-card">

    <div class="icon blue">
      <mat-icon>school</mat-icon>
    </div>

    <div>

      <h2>{{ dashboard.totalStudents }}</h2>

      <p>Étudiants</p>

    </div>

  </div>

  <div class="stat-card">

    <div class="icon green">
      <mat-icon>menu_book</mat-icon>
    </div>

    <div>

      <h2>{{ dashboard.totalFormations }}</h2>

      <p>Formations</p>

    </div>

  </div>

  <div class="stat-card">

    <div class="icon purple">
      <mat-icon>group_work</mat-icon>
    </div>

    <div>

      <h2>{{ dashboard.totalGroups }}</h2>

      <p>Groupes</p>

    </div>

  </div>

</div>

<!-- ===================================
     ETUDIANTS PAR FORMATION
=================================== -->

<div class="stats-grid">

  <mat-card class="chart-card">

    <mat-card-header>

      <mat-card-title>

        Effectif par formation

      </mat-card-title>

    </mat-card-header>

    <mat-card-content>

      <div
        class="stat-line"
        *ngFor="
          let item of dashboard.studentsByFormation
        ">

        <span>

          {{ item.label }}

        </span>

        <strong>

          {{ item.value }}

        </strong>

      </div>

    </mat-card-content>

  </mat-card>

</div>

<!-- ===================================

=================================== -->

<div class="stats-grid">

        <strong>

        </strong>

</div>
