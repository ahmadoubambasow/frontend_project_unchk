<div class="page-container">

  <div class="page-header">

    <div>

      <h1>

        Emplois du Temps

      </h1>

      <p>

        Gestion des créneaux pédagogiques

      </p>

    </div>

    <button

      mat-raised-button

      color="primary"

      (click)="openCreateDialog()">

      <mat-icon>

        add

      </mat-icon>

      Nouveau créneau

    </button>

    <button

      mat-stroked-button

      color="primary"

      routerLink="/schedules/calendar">

      <mat-icon>

        calendar_month

      </mat-icon>

      Calendrier

    </button>

  </div>

  <div
    class="loading"
    *ngIf="loading">

    Chargement...
  </div>

  <div
    class="schedule-grid"

    *ngIf="!loading">

    <div

      class="schedule-card"

      *ngFor="
        let schedule
        of schedules
      ">

      <div

        class="color-bar"

        [style.background]="
          schedule.color
        ">

      </div>

      <h3>

        {{ schedule.moduleName }}

      </h3>

      <p>

        {{ schedule.groupName }}

      </p>

      <p>

        {{ schedule.trainerName }}

      </p>

      <p>

        {{ schedule.dayOfWeek }}

      </p>

      <p>

        {{ schedule.startTime }}

        -

        {{ schedule.endTime }}

      </p>

      <p>

        Salle

        {{ schedule.room }}

      </p>

      <div class="actions">

        <button

          mat-icon-button

          color="primary"

          (click)="openEditDialog(schedule)">

          <mat-icon>

            edit

          </mat-icon>

        </button>

        <button

          mat-icon-button

          color="warn"

          (click)="deleteSchedule(schedule)">

          <mat-icon>

            delete

          </mat-icon>

        </button>

      </div>

    </div>

  </div>

</div>
