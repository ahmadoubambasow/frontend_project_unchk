<div class="dialog-container">

  <div class="dialog-header">

    <h2>

      {{
        data
          ? 'Modifier un créneau'
          : 'Nouveau créneau'
      }}

    </h2>

    <p>

      Gestion des emplois du temps

    </p>

  </div>

  <form

    [formGroup]="form"

    class="schedule-form">

    <div class="form-grid">

      <mat-form-field appearance="outline">

        <mat-label>

          Groupe

        </mat-label>

        <mat-select
          formControlName="groupId">

          <mat-option

            *ngFor="
              let group
              of groups
            "

            [value]="group.id">

            {{ group.name }}

            -

            {{ group.promotion }}

          </mat-option>

        </mat-select>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Module

        </mat-label>

        <mat-select
          formControlName="trainingModuleId">

          <mat-option

            *ngFor="
              let module
              of filteredModules
            "

            [value]="module.id">

            {{ module.title }}

          </mat-option>

        </mat-select>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Formateur

        </mat-label>

        <mat-select
          formControlName="trainerId">

          <mat-option

            *ngFor="
              let trainer
              of trainers
            "

            [value]="trainer.id">

            {{ trainer.fullName }}

          </mat-option>

        </mat-select>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Jour

        </mat-label>

        <mat-select
          formControlName="dayOfWeek">

          <mat-option

            *ngFor="
              let day
              of days
            "

            [value]="day">

            {{ day }}

          </mat-option>

        </mat-select>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Heure début

        </mat-label>

        <input

          matInput

          type="time"

          formControlName="startTime">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Heure fin

        </mat-label>

        <input

          matInput

          type="time"

          formControlName="endTime">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Salle

        </mat-label>

        <input

          matInput

          formControlName="room">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Couleur

        </mat-label>

        <input

          matInput

          type="color"

          formControlName="color">

      </mat-form-field>

    </div>

  </form>

  <div class="dialog-actions">

    <button

      mat-stroked-button

      (click)="dialogRef.close()">

      Annuler

    </button>

    <button

      mat-raised-button

      color="primary"

      [disabled]="loading"

      (click)="submit()">

      {{

        loading

          ? 'Enregistrement...'

          : data

            ? 'Modifier'

            : 'Créer'
      }}

    </button>

  </div>

</div>
