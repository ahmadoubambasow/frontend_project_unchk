<div class="dialog-container">

  <div class="dialog-header">

    <h2>

      {{
        data
          ? 'Modifier partenaire'
          : 'Nouveau partenaire'
      }}

    </h2>

    <p>

      Gestion des partenaires institutionnels

    </p>

  </div>

  <form
    [formGroup]="form"
    class="partner-form">

    <div class="form-grid">

      <mat-form-field appearance="outline">

        <mat-label>

          Nom du partenaire

        </mat-label>

        <input
          matInput
          formControlName="name">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Secteur d'activité

        </mat-label>

        <input
          matInput
          formControlName="sector">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Contact principal

        </mat-label>

        <input
          matInput
          formControlName="contactPerson">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Téléphone

        </mat-label>

        <input
          matInput
          formControlName="phone">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Adresse email

        </mat-label>

        <input
          matInput
          type="email"
          formControlName="email">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Adresse

        </mat-label>

        <input
          matInput
          formControlName="address">

      </mat-form-field>

    </div>

    <mat-form-field
      appearance="outline"
      class="full-width">

      <mat-label>

        Description

      </mat-label>

      <textarea

        matInput

        rows="5"

        formControlName="description">

      </textarea>

    </mat-form-field>

  </form>

  <div class="dialog-actions">

    <button
      mat-stroked-button
      (click)="dialogRef.close()">

      Annuler

    </button>

    <button

      mat-raised-button

      color="primary"

      [disabled]="loading"

      (click)="submit()">

      {{
        data
          ? 'Modifier'
          : 'Créer'
      }}

    </button>

  </div>

</div>
