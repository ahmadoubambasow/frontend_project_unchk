<div class="dialog-container">

  <!-- Header -->
  <div class="dialog-header">

    <div class="dialog-icon">

      <mat-icon>

        {{ data ? 'edit' : 'person_add' }}

      </mat-icon>

    </div>

    <div>

      <h2>

        {{
          data
            ? 'Modifier utilisateur'
            : 'Nouvel utilisateur'
        }}

      </h2>

      <p>

        {{
          data
            ? 'Mettez à jour les informations du compte.'
            : 'Créez un nouveau compte utilisateur.'
        }}

      </p>

    </div>

  </div>

  <!-- Form -->
  <form
    [formGroup]="userForm"
    class="dialog-form">

    <mat-form-field appearance="outline">

      <mat-label>

        Nom complet

      </mat-label>

      <mat-icon matPrefix>

        person

      </mat-icon>

      <input
        matInput
        formControlName="fullName">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Adresse email

      </mat-label>

      <mat-icon matPrefix>

        mail

      </mat-icon>

      <input
        matInput
        type="email"
        formControlName="email">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Mot de passe

      </mat-label>

      <mat-icon matPrefix>

        lock

      </mat-icon>

      <input
        matInput
        type="password"
        formControlName="password">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Rôle

      </mat-label>

      <mat-icon matPrefix>

        badge

      </mat-icon>

      <select
        matNativeControl
        formControlName="roleId">

        <option
          [value]="null">

          Sélectionnez un rôle

        </option>

        <option
          *ngFor="let role of roles"
          [value]="role.id">

          {{ role.name }}

        </option>

      </select>

    </mat-form-field>

  </form>

  <!-- Actions -->
  <div class="dialog-actions">

    <button
      mat-stroked-button
      type="button"
      (click)="dialogRef.close()">

      Annuler

    </button>

    <button
      mat-flat-button
      color="primary"
      type="button"
      [disabled]="loading || userForm.invalid"
      (click)="submit()">

      <mat-icon>

        save

      </mat-icon>

      {{
        loading
          ? 'Enregistrement...'
          : 'Enregistrer'
      }}

    </button>

  </div>

</div>
