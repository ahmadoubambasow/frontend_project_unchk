<div class="dialog-container">

  <div class="dialog-header">

    <h2>

      {{
        data
          ? 'Modifier utilisateur'
          : 'Nouvel utilisateur'
      }}

    </h2>

  </div>

  <form
    [formGroup]="userForm">

    <mat-form-field appearance="outline">

      <mat-label>

        Nom complet

      </mat-label>

      <input
        matInput
        formControlName="fullName">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Email

      </mat-label>

      <input
        matInput
        formControlName="email">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Mot de passe

      </mat-label>

      <input
        matInput
        type="password"
        formControlName="password">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Rôle

      </mat-label>

      <mat-select
        formControlName="roleId">

        <mat-option

          *ngFor="
            let role
            of roles
          "

          [value]="role.id">

          {{ role.name }}

        </mat-option>

      </mat-select>

    </mat-form-field>

  </form>

  <div class="dialog-actions">

    <button
      mat-stroked-button

      (click)="
        dialogRef.close()
      ">

      Annuler

    </button>

    <button
      mat-raised-button
      color="primary"

      [disabled]="loading"

      (click)="submit()">

      {{
        loading
          ? 'Enregistrement...'
          : 'Enregistrer'
      }}

    </button>

  </div>

</div>
