<div class="promotions-page">

  <!-- Header -->
  <div class="page-header">

    <div>

      <h1>
        Promotions
      </h1>

      <p>
        Gestion des promotions académiques
      </p>

    </div>

    <button
      mat-raised-button
      color="primary"
      (click)="openCreateDialog()">

      <mat-icon>
        add
      </mat-icon>

      Nouvelle promotion

    </button>

  </div>

  <!-- Search -->
  <div class="search-container">

    <mat-form-field appearance="outline">

      <mat-label>
        Rechercher une promotion
      </mat-label>

      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Nom, formation, année">

      <mat-icon matSuffix>
        search
      </mat-icon>

    </mat-form-field>

  </div>

  <!-- Table -->
  <div class="table-container">

    <table
      mat-table
      [dataSource]="dataSource">

      <!-- Nom -->
      <ng-container matColumnDef="name">

        <th mat-header-cell *matHeaderCellDef>

          Promotion

        </th>

        <td mat-cell *matCellDef="let promotion">

          {{ promotion.name }}

        </td>

      </ng-container>

      <!-- Formation -->
      <ng-container matColumnDef="formation">

        <th mat-header-cell *matHeaderCellDef>

          Formation

        </th>

        <td mat-cell *matCellDef="let promotion">

          {{ promotion.formationName }}

        </td>

      </ng-container>

      <!-- Année -->
      <ng-container matColumnDef="academicYear">

        <th mat-header-cell *matHeaderCellDef>

          Année académique

        </th>

        <td mat-cell *matCellDef="let promotion">

          {{ promotion.academicYear }}

        </td>

      </ng-container>

      <!-- Capacité -->
      <ng-container matColumnDef="capacity">

        <th mat-header-cell *matHeaderCellDef>

          Capacité

        </th>

        <td mat-cell *matCellDef="let promotion">

          {{ promotion.capacity }}

        </td>

      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">

        <th mat-header-cell *matHeaderCellDef>

          Actions

        </th>

        <td mat-cell *matCellDef="let promotion">

          <button
            mat-icon-button
            (click)="openEditDialog(promotion)">

            <mat-icon color="primary">
              edit
            </mat-icon>

          </button>

          <button
            mat-icon-button
            (click)="deletePromotion(promotion)">

            <mat-icon color="warn">
              delete
            </mat-icon>

          </button>

        </td>

      </ng-container>

      <!-- Header -->
      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <!-- Rows -->
      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns
        ">
      </tr>

    </table>

    <!-- Pagination -->
    <mat-paginator

      [pageSize]="5"

      [pageSizeOptions]="[
        5,
        10,
        20
      ]"

      showFirstLastButtons>

    </mat-paginator>

  </div>

</div>
