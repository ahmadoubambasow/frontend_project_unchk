<div class="dialog-container">

  <!-- Header -->
  <div class="dialog-header">

    <h2>

      {{
        data
          ? 'Modifier promotion'
          : 'Nouvelle promotion'
      }}

    </h2>

    <p>

      Gestion des promotions académiques

    </p>

  </div>

  <!-- Form -->
  <form
    [formGroup]="promotionForm">

    <!-- Nom -->
    <mat-form-field appearance="outline">

      <mat-label>

        Nom de la promotion

      </mat-label>

      <input
        matInput
        formControlName="name"
        placeholder="L3 INFO 2025-2026">

    </mat-form-field>

    <!-- Année -->
    <mat-form-field appearance="outline">

      <mat-label>

        Année académique

      </mat-label>

      <input
        matInput
        formControlName="academicYear"
        placeholder="2025-2026">

    </mat-form-field>

    <!-- Capacité -->
    <mat-form-field appearance="outline">

      <mat-label>

        Capacité

      </mat-label>

      <input
        matInput
        type="number"
        formControlName="capacity">

    </mat-form-field>

    <!-- Formation -->
    <mat-form-field appearance="outline">

      <mat-label>

        Formation

      </mat-label>

      <mat-select
        formControlName="formationId">

        <mat-option

          *ngFor="
            let formation
            of formations
          "

          [value]="formation.id">

          {{ formation.name }}

          -

          {{ formation.code }}

        </mat-option>

      </mat-select>

    </mat-form-field>

  </form>

  <!-- Actions -->
  <div class="dialog-actions">

    <button
      mat-stroked-button
      (click)="dialogRef.close()">

      Annuler

    </button>

    <button

      mat-raised-button

      color="primary"

      (click)="submit()"

      [disabled]="
        loading ||
        promotionForm.invalid
      ">

      {{

        loading

          ? (
              data
                ? 'Modification...'
                : 'Création...'
            )

          : (
              data
                ? 'Modifier'
                : 'Ajouter'
            )

      }}

    </button>

  </div>

</div>
