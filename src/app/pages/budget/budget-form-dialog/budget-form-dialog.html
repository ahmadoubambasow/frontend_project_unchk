<div class="dialog-container">

  <div class="dialog-header">

    <h2>

      {{
        data
          ? 'Modifier budget'
          : 'Nouveau budget'
      }}

    </h2>

  </div>

  <form
    [formGroup]="form">

    <div class="form-grid">

      <mat-form-field appearance="outline">

        <mat-label>

          Année

        </mat-label>

        <input
          matInput
          type="number"
          formControlName="year">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Type

        </mat-label>

        <mat-select
          formControlName="type">

          <mat-option

            *ngFor="
              let type
              of budgetTypes
            "

            [value]="type">

            {{ getTypeLabel(type) }}

          </mat-option>

        </mat-select>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Titre

        </mat-label>

        <input
          matInput
          formControlName="title">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Budget prévu

        </mat-label>

        <input
          matInput
          type="number"
          formControlName="plannedAmount">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Budget réalisé

        </mat-label>

        <input
          matInput
          type="number"
          formControlName="executedAmount">

      </mat-form-field>

    </div>

    <div class="variance-card">

      <h3>

        Écart budgétaire

      </h3>

      <span>

        {{ variance | number }}

      </span>

    </div>

    <mat-form-field
      appearance="outline"
      class="full-width">

      <mat-label>

        Description

      </mat-label>

      <textarea

        matInput

        rows="6"

        formControlName="description">

      </textarea>

    </mat-form-field>

    <div class="upload-zone">

      <input

        hidden

        #fileInput

        type="file"

        (change)="onFileSelected($event)">

      <button

        type="button"

        mat-stroked-button

        (click)="fileInput.click()">

        Choisir un document

      </button>

      <span>

        {{
          selectedFile?.name
          || 'Aucun fichier'
        }}

      </span>

    </div>

  </form>

  <div class="dialog-actions">

    <button
      mat-stroked-button
      (click)="dialogRef.close()">

      Annuler

    </button>

    <button

      mat-raised-button

      color="primary"

      [disabled]="loading"

      (click)="submit()">

      Enregistrer

    </button>

  </div>

</div>
