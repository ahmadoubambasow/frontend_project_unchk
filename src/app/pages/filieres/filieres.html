<div class="page-container">

  <div class="page-header">

    <div>

      <h1>
        Filières
      </h1>

      <p>
        Gestion des filières académiques
      </p>

    </div>

    <button

      mat-raised-button

      color="primary"

      (click)="openCreateDialog()">

      <mat-icon>
        add
      </mat-icon>

      Nouvelle filière

    </button>

  </div>

  <div class="search-container">

    <mat-form-field
      appearance="outline">

      <mat-label>

        Rechercher

      </mat-label>

      <input

        matInput

        (keyup)="applyFilter($event)">

    </mat-form-field>

  </div>

  <div class="table-container">

    <table
      mat-table
      [dataSource]="dataSource">

      <!-- Code -->
      <ng-container
        matColumnDef="code">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Code

        </th>

        <td
          mat-cell
          *matCellDef="let row">

          {{ row.code }}

        </td>

      </ng-container>

      <!-- Nom -->
      <ng-container
        matColumnDef="name">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Nom

        </th>

        <td
          mat-cell
          *matCellDef="let row">

          {{ row.name }}

        </td>

      </ng-container>

      <!-- Description -->
      <ng-container
        matColumnDef="description">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Description

        </th>

        <td
          mat-cell
          *matCellDef="let row">

          {{ row.description }}

        </td>

      </ng-container>

      <!-- Actions -->
      <ng-container
        matColumnDef="actions">

        <th
          mat-header-cell
          *matHeaderCellDef>

          Actions

        </th>

        <td
          mat-cell
          *matCellDef="let row">

          <button
            mat-icon-button
            (click)="openEditDialog(row)">

            <mat-icon>
              edit
            </mat-icon>

          </button>

          <button
            mat-icon-button
            (click)="deleteFiliere(row)">

            <mat-icon color="warn">
              delete
            </mat-icon>

          </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="
          displayedColumns
        ">
      </tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns:
          displayedColumns
        ">
      </tr>

    </table>

    <mat-paginator
      [pageSize]="10">
    </mat-paginator>

  </div>

</div>
