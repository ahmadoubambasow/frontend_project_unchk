<div class="dialog-container">

  <div class="dialog-header">

    <h2>

      {{
        data
          ? 'Modifier insertion'
          : 'Nouvelle insertion'
      }}

    </h2>

    <p>

      Suivi de l'insertion professionnelle

    </p>

  </div>

  <form
    [formGroup]="form"
    class="insertion-form">

    <div class="form-grid">

      <mat-form-field appearance="outline">

        <mat-label>

          Étudiant

        </mat-label>

        <mat-select
          formControlName="studentId">

          <mat-option

            *ngFor="
              let student
              of students
            "

            [value]="student.id">

            {{ student.firstName }}
            {{ student.lastName }}

          </mat-option>

        </mat-select>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Situation

        </mat-label>

        <mat-select
          formControlName="status">

          <mat-option

            *ngFor="
              let status
              of statuses
            "

            [value]="status">

            {{ getStatusLabel(status) }}

          </mat-option>

        </mat-select>

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Entreprise

        </mat-label>

        <input
          matInput
          formControlName="company">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Poste

        </mat-label>

        <input
          matInput
          formControlName="position">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Date début

        </mat-label>

        <input
          matInput
          type="date"
          formControlName="startDate">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Salaire

        </mat-label>

        <input
          matInput
          type="number"
          formControlName="salary">

      </mat-form-field>

    </div>

    <mat-form-field
      appearance="outline"
      class="full-width">

      <mat-label>

        Observations

      </mat-label>

      <textarea

        matInput

        rows="5"

        formControlName="remarks">

      </textarea>

    </mat-form-field>

  </form>

  <div class="dialog-actions">

    <button

      mat-stroked-button

      (click)="dialogRef.close()">

      Annuler

    </button>

    <button

      mat-raised-button

      color="primary"

      [disabled]="loading"

      (click)="submit()">

      {{
        data
          ? 'Modifier'
          : 'Créer'
      }}

    </button>

  </div>

</div>
