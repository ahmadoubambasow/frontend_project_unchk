<div
  *ngIf="dashboard"
  class="dashboard">

  <div class="stats-grid">

    <div class="card">

      <h3>

        Partenaires

      </h3>

      <span>

        {{ dashboard.partners }}

      </span>

    </div>

    <div class="card">

      <h3>

        Stages

      </h3>

      <span>

        {{ dashboard.internships }}

      </span>

    </div>

    <div class="card">

      <h3>

        Insertions

      </h3>

      <span>

        {{ dashboard.insertions }}

      </span>

    </div>

    <div class="card">

      <h3>

        Emploi salarié

      </h3>

      <span>

        {{ dashboard.salaried }}

      </span>

    </div>

    <div class="card">

      <h3>

        Auto emploi

      </h3>

      <span>

        {{ dashboard.autoEmployed }}

      </span>

    </div>

    <div class="card">

      <h3>

        Poursuite études

      </h3>

      <span>

        {{ dashboard.furtherStudies }}

      </span>

    </div>

    <div class="card">

      <h3>

        Sans emploi

      </h3>

      <span>

        {{ dashboard.unemployed }}

      </span>

    </div>

  </div>

</div>
