<div class="profile-page">

  <mat-card class="profile-card">

    <div class="profile-banner"></div>

    <div class="profile-header">

      <div class="avatar">

        {{
          form.value.fullName?.charAt(0)?.toUpperCase()
        }}

      </div>

      <h2>

        {{ form.value.fullName }}

      </h2>

      <p>

        {{ form.value.email }}

      </p>

    </div>

    <mat-card-content>

      <form
        [formGroup]="form"
        class="profile-form">

        <div class="form-row">

          <mat-form-field appearance="outline">

            <mat-label>

              Nom complet

            </mat-label>

            <input
              matInput
              formControlName="fullName">

          </mat-form-field>

          <mat-form-field appearance="outline">

            <mat-label>

              Email

            </mat-label>

            <input
              matInput
              formControlName="email"
              readonly>

          </mat-form-field>

        </div>

        <mat-form-field
          appearance="outline"
          class="full-width">

          <mat-label>

            Nouveau mot de passe

          </mat-label>

          <input
            matInput
            type="password"
            formControlName="password">

        </mat-form-field>

      </form>

    </mat-card-content>

    <mat-card-actions>

      <button
        mat-flat-button
        color="primary"
        (click)="save()">

        Enregistrer les modifications

      </button>

    </mat-card-actions>

  </mat-card>

</div>
