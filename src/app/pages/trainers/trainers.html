<div class="trainers-page">

  <!-- Header -->
  <div class="page-header">

    <div>

      <h1>
        Formateurs
      </h1>

      <p>
        Gestion des enseignants, tuteurs et responsables
      </p>

    </div>

    <button
      mat-raised-button
      color="primary"
      (click)="openCreateDialog()">

      <mat-icon>
        add
      </mat-icon>

      Ajouter formateur

    </button>

  </div>

  <!-- Recherche -->
  <div class="search-container">

    <mat-form-field
      appearance="outline">

      <mat-label>
        Rechercher
      </mat-label>

      <input
        matInput
        placeholder="Nom, email, spécialité..."
        (keyup)="applyFilter($event)">

      <mat-icon matSuffix>
        search
      </mat-icon>

    </mat-form-field>

  </div>

  <!-- Table -->
  <div class="table-container">

    <table
      mat-table
      [dataSource]="dataSource">

      <!-- Nom -->
      <ng-container matColumnDef="fullName">

        <th mat-header-cell *matHeaderCellDef>
          Nom complet
        </th>

        <td mat-cell *matCellDef="let trainer">

          {{ trainer.firstName }}
          {{ trainer.lastName }}

        </td>

      </ng-container>

      <!-- Email -->
      <ng-container matColumnDef="email">

        <th mat-header-cell *matHeaderCellDef>
          Email
        </th>

        <td mat-cell *matCellDef="let trainer">

          {{ trainer.email }}

        </td>

      </ng-container>

      <!-- Téléphone -->
      <ng-container matColumnDef="phone">

        <th mat-header-cell *matHeaderCellDef>
          Téléphone
        </th>

        <td mat-cell *matCellDef="let trainer">

          {{ trainer.phone }}

        </td>

      </ng-container>

      <!-- Spécialité -->
      <ng-container matColumnDef="speciality">

        <th mat-header-cell *matHeaderCellDef>
          Spécialité
        </th>

        <td mat-cell *matCellDef="let trainer">

          {{ trainer.speciality }}

        </td>

      </ng-container>

      <!-- Grade -->
      <ng-container matColumnDef="grade">

        <th mat-header-cell *matHeaderCellDef>
          Grade
        </th>

        <td mat-cell *matCellDef="let trainer">

          {{ trainer.grade }}

        </td>

      </ng-container>

      <!-- Type -->
      <ng-container matColumnDef="type">

        <th mat-header-cell *matHeaderCellDef>
          Type
        </th>

        <td mat-cell *matCellDef="let trainer">

          {{ trainer.type }}

        </td>

      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">

        <th mat-header-cell *matHeaderCellDef>
          Actions
        </th>

        <td mat-cell *matCellDef="let trainer">

          <button
            mat-icon-button
            (click)="openEditDialog(trainer)">

            <mat-icon color="primary">
              edit
            </mat-icon>

          </button>

          <button
            mat-icon-button
            (click)="deleteTrainer(trainer)">

            <mat-icon color="warn">
              delete
            </mat-icon>

          </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns;
        ">
      </tr>

    </table>

    <mat-paginator

      [pageSize]="5"

      [pageSizeOptions]="[5, 10, 20]"

      showFirstLastButtons>

    </mat-paginator>

  </div>

</div>
