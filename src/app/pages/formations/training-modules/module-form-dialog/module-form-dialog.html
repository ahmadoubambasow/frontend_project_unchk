<div class="dialog-container">

  <!-- Header -->
  <div class="dialog-header">

    <div class="dialog-icon">

      <mat-icon>

        menu_book

      </mat-icon>

    </div>

    <div>

      <h2>

        {{
          data.module
            ? 'Modifier module'
            : 'Nouveau module'
        }}

      </h2>

      <p>

        Configurez les informations du module pédagogique.

      </p>

    </div>

  </div>

  <!-- Formulaire -->
  <form
    [formGroup]="form"
    class="dialog-form">

    <div class="form-grid">

      <mat-form-field appearance="outline">

        <mat-label>

          Titre du module

        </mat-label>

        <mat-icon matPrefix>

          title

        </mat-icon>

        <input
          matInput
          formControlName="title">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Volume horaire

        </mat-label>

        <mat-icon matPrefix>

          schedule

        </mat-icon>

        <input
          matInput
          type="number"
          formControlName="hours">

        <span matSuffix>

          h

        </span>

      </mat-form-field>

    </div>

    <mat-form-field
      appearance="outline"
      class="full-width">

      <mat-label>

        Description

      </mat-label>

      <mat-icon matPrefix>

        description

      </mat-icon>

      <textarea
        matInput
        rows="5"
        formControlName="description">

      </textarea>

    </mat-form-field>

  </form>

  <!-- Aperçu -->
  <div
    class="summary-card"
    *ngIf="form.value.title">

    <mat-icon>

      auto_stories

    </mat-icon>

    <div>

      <span>

        Aperçu du module

      </span>

      <strong>

        {{ form.value.title }}

      </strong>

      <small
        *ngIf="form.value.hours">

        {{ form.value.hours }} heures prévues

      </small>

    </div>

  </div>

  <!-- Actions -->
  <div class="dialog-actions">

    <button
      mat-stroked-button
      (click)="dialogRef.close()">

      Annuler

    </button>

    <button
      mat-flat-button
      color="primary"
      [disabled]="loading"
      (click)="submit()">

      <mat-icon>

        save

      </mat-icon>

      {{
        loading
          ? 'Enregistrement...'
          : data.module
              ? 'Mettre à jour'
              : 'Créer'
      }}

    </button>

  </div>

</div>
