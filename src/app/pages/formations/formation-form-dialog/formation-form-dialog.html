<div class="dialog-container">

  <!-- Header -->
  <div class="dialog-header">

    <h2>

      {{
        data
          ? 'Modifier formation'
          : 'Ajouter formation'
      }}

    </h2>

    <p>
      Gestion des formations
    </p>

  </div>

  <!-- Form -->
  <form
    [formGroup]="formationForm">

    <!-- Name -->
    <mat-form-field appearance="outline">

      <mat-label>
        Nom formation
      </mat-label>

      <input
        matInput
        formControlName="name">

    </mat-form-field>

    <!-- Description -->
    <mat-form-field appearance="outline">

      <mat-label>
        Description
      </mat-label>

      <textarea
        matInput
        rows="4"
        formControlName="description">
      </textarea>

    </mat-form-field>

    <!-- Duration -->
    <mat-form-field appearance="outline">

      <mat-label>
        Durée (mois)
      </mat-label>

      <input
        matInput
        type="number"
        formControlName="duration">

    </mat-form-field>

  </form>

  <!-- Actions -->
  <div class="dialog-actions">

    <button
      mat-stroked-button
      (click)="dialogRef.close()">

      Annuler

    </button>

    <button
      mat-raised-button
      color="primary"
      [disabled]="loading"
      (click)="submit()">

      {{
        loading

          ? (
              data
                ? 'Modification...'
                : 'Création...'
            )

          : (
              data
                ? 'Modifier'
                : 'Ajouter'
            )
      }}

    </button>

  </div>

</div>
