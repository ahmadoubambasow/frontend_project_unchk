<div class="dialog-container">

  <!-- Header -->
  <div class="dialog-header">

    <h2>
      {{
        data
          ? 'Modifier formation'
          : 'Ajouter formation'
      }}
    </h2>

    <p>
      Gestion des formations
    </p>

  </div>

  <!-- Form -->
  <form [formGroup]="formationForm">

    <!-- Nom -->
    <mat-form-field appearance="outline">

      <mat-label>
        Nom formation
      </mat-label>

      <input
        matInput
        formControlName="name">

    </mat-form-field>

    <!-- Description -->
    <mat-form-field appearance="outline">

      <mat-label>
        Description
      </mat-label>

      <textarea
        matInput
        rows="4"
        formControlName="description">
      </textarea>

    </mat-form-field>

    <!-- Durée -->
    <mat-form-field appearance="outline">

      <mat-label>
        Durée (mois)
      </mat-label>

      <input
        matInput
        type="number"
        formControlName="duration">

    </mat-form-field>

    <!-- Filière -->
    <mat-form-field appearance="outline">

      <mat-label>
        Filière
      </mat-label>

      <mat-select
        formControlName="filiereId">

        <mat-option
          *ngFor="let filiere of filieres"
          [value]="filiere.id">

          {{ filiere.name }}
          -
          {{ filiere.code }}

        </mat-option>

      </mat-select>

    </mat-form-field>

  </form>

  <!-- Actions -->
  <div class="dialog-actions">

    <button
      mat-stroked-button
      (click)="dialogRef.close()">

      Annuler

    </button>

    <button
      mat-raised-button
      color="primary"
      (click)="submit()"
      [disabled]="loading || formationForm.invalid">

      {{
        loading
          ? (
              data
                ? 'Modification...'
                : 'Création...'
            )
          : (
              data
                ? 'Modifier'
                : 'Ajouter'
            )
      }}

    </button>

  </div>

</div>
