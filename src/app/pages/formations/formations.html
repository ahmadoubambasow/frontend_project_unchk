<div class="formations-page">

  <!-- Header -->
  <div class="page-header">

    <div>

      <h1>
        Formations
      </h1>

      <p>
        Gestion des formations académiques
      </p>

    </div>

    <!-- Add -->
    <button
      mat-raised-button
      color="primary"
      (click)="openCreateDialog()"
    >

      <mat-icon>
        add
      </mat-icon>

      Ajouter formation

    </button>

  </div>

  <!-- Search -->
  <div class="search-container">

    <mat-form-field
      appearance="outline">

      <mat-label>
        Rechercher formation
      </mat-label>

      <input
        matInput
        (keyup)="applyFilter($event)"
        placeholder="Code, nom...">

      <mat-icon matSuffix>
        search
      </mat-icon>

    </mat-form-field>

  </div>

  <!-- Table -->
  <div class="table-container">

    <table
      mat-table
      [dataSource]="dataSource">

      <!-- Code -->
      <ng-container matColumnDef="code">

        <th mat-header-cell *matHeaderCellDef>
          Code
        </th>

        <td mat-cell *matCellDef="let formation">

          {{ formation.code }}

        </td>

      </ng-container>

      <!-- Name -->
      <ng-container matColumnDef="name">

        <th mat-header-cell *matHeaderCellDef>
          Formation
        </th>

        <td mat-cell *matCellDef="let formation">

          {{ formation.name }}

        </td>

      </ng-container>

      <!-- Duration -->
      <ng-container matColumnDef="duration">

        <th mat-header-cell *matHeaderCellDef>
          Durée
        </th>

        <td mat-cell *matCellDef="let formation">

          {{ formation.duration }} mois

        </td>

      </ng-container>

      <!-- Status -->
      <ng-container matColumnDef="status">

        <th mat-header-cell *matHeaderCellDef>
          Statut
        </th>

        <td mat-cell *matCellDef="let formation">

          <span class="status active">

            {{ formation.status }}

          </span>

        </td>

      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">

        <th mat-header-cell *matHeaderCellDef>
          Actions
        </th>

        <td mat-cell *matCellDef="let formation">

          <button mat-icon-button>

            <mat-icon color="primary">
              edit
            </mat-icon>

          </button>

          <button mat-icon-button>

            <mat-icon color="warn">
              delete
            </mat-icon>

          </button>

        </td>

      </ng-container>

      <!-- Header -->
      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <!-- Rows -->
      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns;
        ">
      </tr>

    </table>

    <!-- Pagination -->
    <mat-paginator

      [pageSize]="5"

      [pageSizeOptions]="[5, 10, 20]"

      showFirstLastButtons>

    </mat-paginator>

  </div>

</div>
