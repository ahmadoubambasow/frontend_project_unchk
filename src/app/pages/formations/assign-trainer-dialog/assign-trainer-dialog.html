<div class="dialog-container">

  <!-- Header -->
  <div class="dialog-header">

    <div class="dialog-icon">

      <mat-icon>

        person_add

      </mat-icon>

    </div>

    <div>

      <h2>

        Affecter un formateur

      </h2>

      <p>

        Sélectionnez un formateur pour l'associer à cette formation.

      </p>

    </div>

  </div>

  <!-- Formulaire -->
  <form
    [formGroup]="form"
    class="dialog-form">

    <div class="section-card">

      <div class="section-header">

        <mat-icon>

          groups

        </mat-icon>

        <h3>

          Formateur

        </h3>

      </div>

      <mat-form-field
        appearance="outline"
        class="full-width">

        <mat-label>

          Choisir un formateur

        </mat-label>

        <mat-icon matPrefix>

          school

        </mat-icon>

        <mat-select
          formControlName="trainerId">

          <mat-option
            *ngFor="let trainer of trainers"
            [value]="trainer.id">

            <div class="trainer-option">

              <div class="trainer-avatar">

                {{ trainer.fullName.charAt(0) }}

              </div>

              <div class="trainer-details">

                <span class="trainer-name">

                  {{ trainer.fullName }}

                </span>

                <small>

                  {{ trainer.role }}

                </small>

              </div>

            </div>

          </mat-option>

        </mat-select>

      </mat-form-field>

    </div>

  </form>

  <!-- Actions -->
  <div class="dialog-actions">

    <button
      mat-stroked-button
      (click)="dialogRef.close()">

      Annuler

    </button>

    <button
      mat-flat-button
      color="primary"
      [disabled]="loading"
      (click)="submit()">

      <mat-icon>

        person_add

      </mat-icon>

      {{

        loading
          ? 'Affectation...'
          : 'Affecter'

      }}

    </button>

  </div>

</div>
