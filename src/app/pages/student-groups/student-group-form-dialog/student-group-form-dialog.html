<div class="dialog-container">

  <h2>

    {{
      data
      ? 'Modifier groupe'
      : 'Nouveau groupe'
    }}

  </h2>

  <form [formGroup]="form">

    <mat-form-field appearance="outline">

      <mat-label>

        Nom du groupe

      </mat-label>

      <input
        matInput
        formControlName="name">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Promotion

      </mat-label>

      <input
        matInput
        formControlName="promotion">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Année académique

      </mat-label>

      <input

        matInput

        type="number"

        formControlName="academicYear">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Formation

      </mat-label>

      <mat-select
        formControlName="formationId">

        <mat-option

          *ngFor="
            let formation
            of formations
          "

          [value]="formation.id">

          {{ formation.name }}

        </mat-option>

      </mat-select>

    </mat-form-field>

  </form>

  <div class="dialog-actions">

    <button
      mat-stroked-button>

      Annuler

    </button>

    <button
      mat-raised-button
      color="primary" (click)="submit()">

      Enregistrer

    </button>

  </div>

</div>
