<div class="dialog-container">

  <!-- Header -->
  <div class="dialog-header">

    <div class="dialog-icon">

      <mat-icon>

        groups

      </mat-icon>

    </div>

    <div>

      <h2>

        {{
          data
            ? 'Modifier groupe'
            : 'Nouveau groupe'
        }}

      </h2>

      <p>

        Configurez les informations du groupe étudiant.

      </p>

    </div>

  </div>

  <!-- Formulaire -->
  <form
    [formGroup]="form"
    class="group-form">

    <div class="form-grid">

      <mat-form-field appearance="outline">

        <mat-label>

          Nom du groupe

        </mat-label>

        <mat-icon matPrefix>

          group_work

        </mat-icon>

        <input
          matInput
          formControlName="name">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Promotion

        </mat-label>

        <mat-icon matPrefix>

          workspace_premium

        </mat-icon>

        <input
          matInput
          formControlName="promotion">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Année académique

        </mat-label>

        <mat-icon matPrefix>

          calendar_today

        </mat-icon>

        <input
          matInput
          type="number"
          formControlName="academicYear">

      </mat-form-field>

      <mat-form-field appearance="outline">

        <mat-label>

          Formation

        </mat-label>

        <mat-icon matPrefix>

          school

        </mat-icon>

        <select
          matNativeControl
          formControlName="formationId">

          <option
            *ngFor="let formation of formations"
            [value]="formation.id">

            {{ formation.name }}

          </option>

        </select>

      </mat-form-field>

    </div>

  </form>

  <!-- Actions -->
  <div class="dialog-actions">

    <button
      mat-stroked-button
      type="button">

      Annuler

    </button>

    <button
      mat-flat-button
      color="primary"
      type="button"
      (click)="submit()">

      <mat-icon>

        save

      </mat-icon>

      Enregistrer

    </button>

  </div>

</div>
