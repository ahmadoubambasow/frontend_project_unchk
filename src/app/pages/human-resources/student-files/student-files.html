<div class="page-container">

  <!-- Header -->
  <div class="page-header">

    <div>

      <h1>

        Dossiers étudiants

      </h1>

      <p>

        Gestion administrative des étudiants

      </p>

    </div>

    <button
      mat-flat-button
      color="primary"
      (click)="openCreateDialog()">

      <mat-icon>

        add

      </mat-icon>

      Nouveau dossier

    </button>

  </div>

  <!-- Recherche -->
  <mat-card class="search-card">

    <mat-form-field appearance="outline">

      <mat-label>

        Rechercher un étudiant

      </mat-label>

      <mat-icon matPrefix>

        search

      </mat-icon>

      <input
        matInput
        placeholder="Nom, matricule ou responsable..."
        (input)="applyFilter($event)">

    </mat-form-field>

  </mat-card>

  <!-- Liste -->
  <div class="student-grid">

    <mat-card
      class="student-card"
      *ngFor="let student of filteredStudentFiles">

      <!-- Bandeau -->
      <div class="student-banner"></div>

      <!-- Profil -->
      <div class="student-profile">

        <div class="avatar">

          {{ student.fullName.charAt(0) }}

        </div>

        <div class="student-details">

          <h3>

            {{ student.fullName }}

          </h3>

          <span class="matricule">

            {{ student.registrationNumber }}

          </span>

        </div>

      </div>

      <!-- Informations -->
      <div class="student-info">

        <div class="info-card">

          <mat-icon>

            family_restroom

          </mat-icon>

          <div>

            <span>

              Responsable

            </span>

            <strong>

              {{ student.guardianName }}

            </strong>

          </div>

        </div>

        <div class="info-card">

          <mat-icon>

            phone

          </mat-icon>

          <div>

            <span>

              Téléphone

            </span>

            <strong>

              {{ student.guardianPhone }}

            </strong>

          </div>

        </div>

      </div>

      <!-- Actions -->
      <div class="card-actions">

        <button
          mat-flat-button
          color="primary"
          (click)="openDetails(student)">

          <mat-icon>

            visibility

          </mat-icon>

          Consulter

        </button>

        <button
          mat-icon-button
          color="accent"
          (click)="openEditDialog(student)">

          <mat-icon>

            edit

          </mat-icon>

        </button>

        <button
          mat-icon-button
          color="warn"
          (click)="deleteStudentFile(student)">

          <mat-icon>

            delete

          </mat-icon>

        </button>

      </div>

    </mat-card>

  </div>

</div>
