<div class="page-container">

  <div class="page-header">

    <div>

      <h1>
        Communications
      </h1>

      <p>

        Gestion des comptes rendus et circulaires

      </p>

    </div>

    <button
      mat-raised-button
      color="primary"
      (click)="openCreateDialog()"  
    >

      <mat-icon>
        add
      </mat-icon>

      Nouvelle communication

    </button>

  </div>

  <mat-form-field appearance="outline">

    <mat-label>

      Recherche

    </mat-label>

    <input
      matInput
      (keyup)="applyFilter($event)">

  </mat-form-field>

  <div class="table-container">

    <table
      mat-table
      [dataSource]="dataSource">

      <ng-container matColumnDef="title">

        <th mat-header-cell *matHeaderCellDef>
          Titre
        </th>

        <td mat-cell *matCellDef="let row">
          {{ row.title }}
        </td>

      </ng-container>

      <ng-container matColumnDef="type">

        <th mat-header-cell *matHeaderCellDef>
          Type
        </th>

        <td mat-cell *matCellDef="let row">
          {{ row.type }}
        </td>

      </ng-container>

      <ng-container matColumnDef="eventDate">

        <th mat-header-cell *matHeaderCellDef>
          Date
        </th>

        <td mat-cell *matCellDef="let row">
          {{ row.eventDate }}
        </td>

      </ng-container>

      <ng-container matColumnDef="accessRole">

        <th mat-header-cell *matHeaderCellDef>
          Accès
        </th>

        <td mat-cell *matCellDef="let row">
          {{ row.accessRole }}
        </td>

      </ng-container>

      <ng-container matColumnDef="actions">

        <th mat-header-cell *matHeaderCellDef>
          Actions
        </th>

        <td mat-cell *matCellDef="let row">

          <button mat-icon-button (click)="editCommunication(row)">

            <mat-icon>
              edit
            </mat-icon>

          </button>

          <button
            mat-icon-button
            color="warn"
            (click)="deleteCommunication(row)"
           >

            <mat-icon>
              delete
            </mat-icon>

          </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns
        ">
      </tr>

    </table>

    <mat-paginator
      [pageSize]="10">
    </mat-paginator>

  </div>

</div>
