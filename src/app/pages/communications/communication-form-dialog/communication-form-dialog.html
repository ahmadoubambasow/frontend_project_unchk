<div class="dialog-container">

  <div class="dialog-header">

    <h2>

      {{
        data
          ? 'Modifier communication'
          : 'Nouvelle communication'
      }}

    </h2>

    <p>

      Gestion des comptes rendus

    </p>

  </div>

  <form [formGroup]="communicationForm">

    <mat-form-field appearance="outline">

      <mat-label>

        Titre

      </mat-label>

      <input
        matInput
        formControlName="title">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Type

      </mat-label>

      <mat-select
        formControlName="type">

        <mat-option

          *ngFor="
            let type
            of communicationTypes
          "

          [value]="type">

          {{ type }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Description

      </mat-label>

      <textarea
        matInput
        rows="3"
        formControlName="description">
      </textarea>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Compte rendu

      </mat-label>

      <textarea
        matInput
        rows="5"
        formControlName="report">
      </textarea>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>

        Date

      </mat-label>

      <input
        matInput
        type="datetime-local"
        formControlName="eventDate">

    </mat-form-field>

    <div class="file-upload">

  <label class="upload-label">

    Document associé

  </label>

  <input
    type="file"
    accept=".pdf,.doc,.docx,.xls,.xlsx,.png,.jpg,.jpeg"
    (change)="onFileSelected($event)"
  >

  <div
    class="selected-file"
    *ngIf="selectedFileName">

    {{ selectedFileName }}

  </div>

</div>

    <mat-form-field appearance="outline">

      <mat-label>

        Rôle d'accès

      </mat-label>

      <mat-select
        formControlName="accessRole">

        <mat-option

          *ngFor="
            let role
            of accessRoles
          "

          [value]="role.value">

          {{ role.label }}

        </mat-option>

      </mat-select>

    </mat-form-field>

  </form>

  <div class="dialog-actions">

    <button
      mat-stroked-button
      (click)="dialogRef.close()">

      Annuler

    </button>

    <button
      mat-raised-button
      color="primary"
      [disabled]="loading"
      (click)="submit()">

      {{
        loading
          ? 'Enregistrement...'
          : 'Enregistrer'
      }}

    </button>

  </div>

</div>
