<div class="assignments-page">

  <div class="page-header">

    <div>

      <h1>
        Affectations
      </h1>

      <p>
        Gestion des affectations enseignants / matières
      </p>

    </div>

    <button

      mat-raised-button

      color="primary"

      (click)="openCreateDialog()">

      <mat-icon>
        add
      </mat-icon>

      Nouvelle affectation

    </button>

  </div>

  <div class="search-container">

    <mat-form-field appearance="outline">

      <mat-label>
        Rechercher
      </mat-label>

      <input

        matInput

        (keyup)="applyFilter($event)"

        placeholder="Enseignant, matière...">

      <mat-icon matSuffix>

        search

      </mat-icon>

    </mat-form-field>

  </div>

  <div class="table-container">

    <table
      mat-table
      [dataSource]="dataSource">

      <!-- Enseignant -->
      <ng-container matColumnDef="trainer">

        <th mat-header-cell *matHeaderCellDef>
          Enseignant
        </th>

        <td mat-cell *matCellDef="let row">

          {{ row.trainerName }}

        </td>

      </ng-container>

      <!-- Matière -->
      <ng-container matColumnDef="subject">

        <th mat-header-cell *matHeaderCellDef>
          Matière
        </th>

        <td mat-cell *matCellDef="let row">

          {{ row.subjectName }}

        </td>

      </ng-container>

      <!-- Formation -->
      <ng-container matColumnDef="formation">

        <th mat-header-cell *matHeaderCellDef>
          Formation
        </th>

        <td mat-cell *matCellDef="let row">

          {{ row.formationName }}

        </td>

      </ng-container>

      <!-- Filière -->
      <ng-container matColumnDef="filiere">

        <th mat-header-cell *matHeaderCellDef>
          Filière
        </th>

        <td mat-cell *matCellDef="let row">

          {{ row.filiereName }}

        </td>

      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">

        <th mat-header-cell *matHeaderCellDef>
          Actions
        </th>

        <td mat-cell *matCellDef="let row">

          <button

            mat-icon-button

            color="warn"

            (click)="deleteAssignment(row)">

            <mat-icon>

              delete

            </mat-icon>

          </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns
        ">
      </tr>

    </table>

    <mat-paginator

      [pageSize]="10"

      [pageSizeOptions]="[5,10,20,50]"

      showFirstLastButtons>

    </mat-paginator>

  </div>

</div>
