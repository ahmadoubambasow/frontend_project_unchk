<div class="dialog-container">

  <div class="dialog-header">

    <h2>

      {{
        data
          ? 'Modifier matière'
          : 'Nouvelle matière'
      }}

    </h2>

    <p>

      Gestion des matières pédagogiques

    </p>

  </div>

  <form [formGroup]="subjectForm">

    <mat-form-field appearance="outline">

      <mat-label>
        Nom matière
      </mat-label>

      <input
        matInput
        formControlName="name">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>
        Description
      </mat-label>

      <textarea
        matInput
        rows="4"
        formControlName="description">
      </textarea>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>
        Coefficient
      </mat-label>

      <input
        matInput
        type="number"
        formControlName="coefficient">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>
        Volume horaire
      </mat-label>

      <input
        matInput
        type="number"
        formControlName="hours">

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>
        Filière
      </mat-label>

      <mat-select

        formControlName="filiereId"

        (selectionChange)="
          onFiliereChange(
            $event.value
          )
        ">

        <mat-option

          *ngFor="
            let filiere
            of filieres
          "

          [value]="filiere.id">

          {{ filiere.name }}

        </mat-option>

      </mat-select>

    </mat-form-field>

    <mat-form-field appearance="outline">

      <mat-label>
        Formation
      </mat-label>

      <mat-select

        formControlName="formationId"

        [disabled]="
          !subjectForm.get('filiereId')?.value
        ">

        <mat-option

          *ngFor="
            let formation
            of formations
          "

          [value]="formation.id">

          {{ formation.name }}

        </mat-option>

      </mat-select>

    </mat-form-field>

  </form>

  <div class="dialog-actions">

    <button

      mat-stroked-button

      (click)="dialogRef.close()">

      Annuler

    </button>

    <button

      mat-raised-button

      color="primary"

      [disabled]="
        loading ||
        subjectForm.invalid
      "

      (click)="submit()">

      {{

        loading

          ? (
              data
                ? 'Modification...'
                : 'Création...'
            )

          : (
              data
                ? 'Modifier'
                : 'Ajouter'
            )
      }}

    </button>

  </div>

</div>
