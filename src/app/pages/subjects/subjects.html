<div class="subjects-page">

  <div class="page-header">

    <div>

      <h1>
        Matières
      </h1>

      <p>
        Gestion des matières pédagogiques
      </p>

    </div>

    <button

      mat-raised-button

      color="primary"

      (click)="openCreateDialog()">

      <mat-icon>
        add
      </mat-icon>

      Nouvelle matière

    </button>

  </div>

  <div class="search-container">

    <mat-form-field appearance="outline">

      <mat-label>
        Rechercher
      </mat-label>

      <input

        matInput

        (keyup)="applyFilter($event)"

        placeholder="Nom, code, filière...">

      <mat-icon matSuffix>
        search
      </mat-icon>

    </mat-form-field>

  </div>

  <div class="table-container">

    <table
      mat-table
      [dataSource]="dataSource">

      <!-- Code -->
      <ng-container matColumnDef="code">

        <th mat-header-cell *matHeaderCellDef>
          Code
        </th>

        <td mat-cell *matCellDef="let subject">

          {{ subject.code }}

        </td>

      </ng-container>

      <!-- Nom -->
      <ng-container matColumnDef="name">

        <th mat-header-cell *matHeaderCellDef>
          Matière
        </th>

        <td mat-cell *matCellDef="let subject">

          {{ subject.name }}

        </td>

      </ng-container>

      <!-- Filière -->
      <ng-container matColumnDef="filiere">

        <th mat-header-cell *matHeaderCellDef>
          Filière
        </th>

        <td mat-cell *matCellDef="let subject">

          {{ subject.filiereName }}

        </td>

      </ng-container>

      <!-- Formation -->
      <ng-container matColumnDef="formation">

        <th mat-header-cell *matHeaderCellDef>
          Formation
        </th>

        <td mat-cell *matCellDef="let subject">

          {{ subject.formationName }}

        </td>

      </ng-container>

      <!-- Coefficient -->
      <ng-container matColumnDef="coefficient">

        <th mat-header-cell *matHeaderCellDef>
          Coef.
        </th>

        <td mat-cell *matCellDef="let subject">

          {{ subject.coefficient }}

        </td>

      </ng-container>

      <!-- Heures -->
      <ng-container matColumnDef="hours">

        <th mat-header-cell *matHeaderCellDef>
          Heures
        </th>

        <td mat-cell *matCellDef="let subject">

          {{ subject.hours }} h

        </td>

      </ng-container>

      <!-- Actions -->
      <ng-container matColumnDef="actions">

        <th mat-header-cell *matHeaderCellDef>
          Actions
        </th>

        <td mat-cell *matCellDef="let subject">

          <button
            mat-icon-button
            (click)="openEditDialog(subject)">

            <mat-icon color="primary">
              edit
            </mat-icon>

          </button>

          <button
            mat-icon-button
            (click)="deleteSubject(subject)">

            <mat-icon color="warn">
              delete
            </mat-icon>

          </button>

        </td>

      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns">
      </tr>

      <tr
        mat-row
        *matRowDef="
          let row;
          columns: displayedColumns
        ">
      </tr>

    </table>

    <mat-paginator

      [pageSize]="10"

      [pageSizeOptions]="[5,10,20,50]"

      showFirstLastButtons>

    </mat-paginator>

  </div>

</div>
